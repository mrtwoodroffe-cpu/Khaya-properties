<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khaya Properties — Map search</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F1EC;--card:#FBFAF7;--ink:#14201B;--mut:#666B64;--em:#0B2B24;--emt:#F3EFE4;--p:#8A6A2C;--au:#B58B3E;--line:#DDD8CC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A1311;--card:#111E1A;--ink:#EEEAE0;--mut:#9AA39C;--em:#D5B06A;--emt:#0A1311;--p:#D5B06A;--au:#D5B06A;--line:#233029}}
:root[data-theme=dark]{--bg:#0A1311;--card:#111E1A;--ink:#EEEAE0;--mut:#9AA39C;--em:#D5B06A;--emt:#0A1311;--p:#D5B06A;--au:#D5B06A;--line:#233029}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h3,.logo,.pr{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;margin:0}
button,select{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--au);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:1.55rem}.logo i{font-style:normal;color:var(--au)}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:600;background:var(--em);color:var(--emt)}
.bar{padding:14px 18px 6px;display:grid;gap:10px;max-width:1300px;margin:auto}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.modes{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:13px}
.modes button{border:0;background:none;padding:8px 14px;border-radius:9px;color:var(--mut);font-weight:600;white-space:nowrap}
.modes button[aria-pressed=true]{background:var(--em);color:var(--emt)}
select{padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chips button{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:7px 14px}
.chips button[aria-pressed=true]{background:var(--em);color:var(--emt);border-color:var(--em)}
.split{display:grid;gap:16px;padding:8px 18px 24px;max-width:1300px;margin:auto}
@media(min-width:900px){.split{grid-template-columns:minmax(340px,430px) 1fr;align-items:start}#list{max-height:calc(100vh - 230px);overflow:auto;padding-right:6px}.fab{display:none}}
@media(max-width:899px){body:not(.mv) #mapw{display:none}body.mv #list{display:none}}
.it{display:grid;grid-template-columns:104px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px;cursor:pointer;transition:border-color .2s}
.it.sel,.it:hover{border-color:var(--au)}
.th{border-radius:10px;min-height:96px;display:grid;place-items:center}.th svg{width:34px;opacity:.85}
.pr{font-weight:600;font-size:1.5rem;line-height:1.1}.sm{color:var(--mut);font-size:.88rem}.ok{color:var(--p);font-weight:600}
.tg{font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--p)}.pm{background:var(--au);color:#1A1405;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:6px;margin-left:6px}
.hb{float:right;border:0;background:none;font-size:1.2rem;color:var(--mut)}.hb.on{color:#c0304a}
#mapw{position:sticky;top:12px}
.map{position:relative;width:100%;aspect-ratio:600/440;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:color-mix(in srgb,var(--em) 12%,var(--bg))}
.map svg{position:absolute;inset:0;width:100%;height:100%}
#gm{transform-origin:0 0;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.land{fill:var(--card);stroke:var(--au);stroke-width:1.5;vector-effect:non-scaling-stroke}
.les{fill:color-mix(in srgb,var(--em) 12%,var(--bg));stroke:var(--au);stroke-width:1;vector-effect:non-scaling-stroke}
.mk{position:absolute;transform:translate(-50%,-50%);border:2px solid var(--card);background:var(--em);color:var(--emt);font-weight:700;font-size:.78rem;border-radius:999px;padding:0;min-width:16px;height:16px;transition:left .7s cubic-bezier(.3,.7,.2,1),top .7s cubic-bezier(.3,.7,.2,1);box-shadow:0 4px 10px -3px rgba(0,0,0,.5);z-index:2}
.mk.pill{height:auto;padding:4px 9px}.mk.sel{background:var(--au);color:#1A1405;z-index:5;transform:translate(-50%,-50%) scale(1.15)}
.cl{position:absolute;transform:translate(-50%,8px);font-size:.7rem;color:var(--mut);pointer-events:none;white-space:nowrap;transition:left .7s,top .7s}
#pop{position:absolute;left:12px;right:12px;bottom:12px;background:var(--card);border:1px solid var(--au);border-radius:16px;padding:12px;display:none;z-index:9;gap:12px;grid-template-columns:84px 1fr}
#pop.on{display:grid}#pop .th{min-height:84px}#pop .btn{margin-top:8px;padding:8px 14px;font-size:.88rem}
.x{position:absolute;right:8px;top:6px;border:0;background:none;color:var(--mut);font-size:1.1rem}
.note{font-size:.8rem;color:var(--mut);margin-top:8px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--em);color:var(--emt);border:0;border-radius:14px;padding:13px 24px;font-weight:700;box-shadow:0 12px 26px -10px #000;z-index:20}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;display:none;z-index:50}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="logo">Khaya<i>.</i>Properties</div><button class="btn" onclick="toast('Opens the listing flow')">List property</button></header>
<div class="bar">
<div class="top"><div class="modes" id="modes" role="group" aria-label="Mode"><button aria-pressed="true" data-m="sale">Buy</button><button aria-pressed="false" data-m="rent">Rent</button><button aria-pressed="false" data-m="rtb">Rent-to-Buy</button></div>
<select id="fT" aria-label="Type"><option value="">Any type</option><option>House</option><option>Apartment</option><option>Townhouse</option><option>Penthouse</option></select>
<select id="fB" aria-label="Bedrooms"><option value="0">Any beds</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option></select></div>
<div class="chips" id="rg" role="group" aria-label="Region"></div><div class="sm" id="cnt"></div></div>
<div class="split"><div id="list"></div><div id="mapw"><div class="map" id="map"><svg viewBox="0 0 600 440" aria-hidden="true"><g id="gm"><path class="land" d="M1.7 225 L122 105 207 137 299 130 357 102 442 30 506 30 527 108 530 168 561 167 547 222 497 268 470 302 429 345 391 377 326 391 258 401 190 401 122 423 71 401 65 367 48 335 31 288Z"/><ellipse class="les" cx="402" cy="252" rx="34" ry="27"/></g></svg><div id="mks"></div><div id="pop"></div></div>
<p class="note">Schematic map. Locations are approximate; sellers choose whether to share an exact address. The live site uses full street maps.</p></div></div>
<button class="fab" id="fab" onclick="document.body.classList.toggle('mv');this.textContent=document.body.classList.contains('mv')?'Show list':'Show map'">Show map</button>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const C={Sandton:[394,148],Midrand:[400,140],Pretoria:[403,132],'Cape Town':[69,392],Durban:[497,264],Umhlanga:[500,258],Ballito:[505,252],Gqeberha:[313,394],Bloemfontein:[334,241],Polokwane:[444,77],Mbombela:[495,126]};
const VB={all:[0,0,600,440],gp:[352,106,92,68],kzn:[425,203,150,110],wc:[0,335,150,110],ec:[262,342,130,96]};
const RN=[['all','All South Africa'],['gp','Gauteng'],['kzn','KwaZulu-Natal'],['wc','Western Cape'],['ec','Eastern Cape']];
const ML={sale:'FOR SALE',rent:'TO RENT',rtb:'RENT-TO-BUY'};
const pal=[['#2d5a4e','#9CC5B5'],['#4b3a78','#BDAEE0'],['#8a6a2c','#E8CF98'],['#27414f','#9DBBCB']];
const L=[
{id:1,t:'4 Bedroom House',p:1850000,m:'sale',ty:'House',b:4,ba:3,l:'Sandton',r:'gp',s:'Estate Agent',v:1,pm:1,dx:-2,dy:-1},
{id:2,t:'3 Bedroom Townhouse',p:1695000,m:'sale',ty:'Townhouse',b:3,ba:2,l:'Midrand',r:'gp',s:'Private Owner',v:1,dx:3,dy:2},
{id:3,t:'2 Bedroom Apartment',p:14500,m:'rent',ty:'Apartment',b:2,ba:2,l:'Umhlanga',r:'kzn',s:'Landlord',v:1,dx:-1,dy:1},
{id:4,t:'Sea-view Penthouse',p:8900000,m:'sale',ty:'Penthouse',b:3,ba:3,l:'Cape Town',r:'wc',s:'Property Company',v:1,pm:1,dx:1,dy:-2},
{id:5,t:'1 Bedroom Garden Flat',p:6200,m:'rent',ty:'Apartment',b:1,ba:1,l:'Pretoria',r:'gp',s:'Private Owner',v:0,dx:2,dy:-2},
{id:6,t:'3 Bedroom Family Home',p:12900,m:'rtb',ty:'House',b:3,ba:2,l:'Durban',r:'kzn',s:'Developer',v:1,dx:-3,dy:2},
{id:7,t:'4 Bedroom Investment Home',p:2450000,m:'sale',ty:'House',b:4,ba:3,l:'Ballito',r:'kzn',s:'Estate Agent',v:1,dx:2,dy:-2},
{id:8,t:'Student Studio',p:4800,m:'rent',ty:'Apartment',b:1,ba:1,l:'Gqeberha',r:'ec',s:'Landlord',v:1,dx:0,dy:0},
{id:9,t:'3 Bedroom House',p:2150000,m:'sale',ty:'House',b:3,ba:2,l:'Sandton',r:'gp',s:'Private Owner',v:0,dx:5,dy:3},
{id:10,t:'2 Bedroom Apartment',p:2290000,m:'sale',ty:'Apartment',b:2,ba:2,l:'Cape Town',r:'wc',s:'Estate Agent',v:1,dx:5,dy:-4}];
let mode='sale',reg='all',sel=null;const fav=new Set();
try{JSON.parse(localStorage.getItem('kf')||'[]').forEach(x=>fav.add(x))}catch(e){}
const R=n=>'R'+n.toLocaleString('en-ZA'),sh=x=>x.m==='sale'?'R'+(x.p>=1e6?(x.p/1e6).toFixed(2).replace(/\.?0+$/,'')+'m':Math.round(x.p/1e3)+'k'):'R'+(x.p/1e3).toFixed(1).replace('.0','')+'k';
const pos=x=>[C[x.l][0]+x.dx,C[x.l][1]+x.dy];
const pt=x=>x.m==='sale'?R(x.p):R(x.p)+' /mo';
const vis=()=>L.filter(x=>x.m===mode&&(!$('#fT').value||x.ty===$('#fT').value)&&x.b>=+$('#fB').value&&(reg==='all'||x.r===reg));
const house='<svg viewBox="0 0 64 56" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"><path d="M6 28 32 6l26 22M14 24v26h36V24"/></svg>';
function draw(){const v=vis();if(sel&&!v.find(x=>x.id===sel))sel=null;
$('#cnt').textContent=v.length+' properties '+(reg==='all'?'across South Africa':'in '+RN.find(r=>r[0]===reg)[1]);
$('#list').innerHTML=v.map(x=>{const [a,b]=pal[x.id%4];return `<article class="it ${x.id===sel?'sel':''}" onclick="pick(${x.id})"><div class="th" style="background:linear-gradient(135deg,${a},${b})">${house}</div><div><button class="hb ${fav.has(x.id)?'on':''}" aria-label="Favourite" onclick="event.stopPropagation();tf(${x.id})">${fav.has(x.id)?'♥':'♡'}</button><div class="tg">${ML[x.m]}${x.pm?'<span class="pm">Promoted</span>':''}</div><div class="pr">${pt(x)}</div><div>${x.t}</div><div class="sm">${x.b} bed · ${x.ba} bath · ${x.l}</div><div class="sm">${x.s}${x.v?' <span class="ok">Verified ✓</span>':''}</div></div></article>`}).join('')||'<p class="sm">No properties match. Try another region or filter.</p>';
const [vx,vy,vw,vh]=VB[reg],k=600/vw;$('#gm').style.transform=`scale(${k}) translate(${-vx}px,${-vy}px)`;
const pct=(p)=>[(p[0]-vx)/vw*100,(p[1]-vy)/vh*100],zoom=reg!=='all';
$('#mks').innerHTML=Object.entries(C).filter(([n,c])=>c[0]>vx&&c[0]<vx+vw&&c[1]>vy&&c[1]<vy+vh&&(zoom||0)).map(([n,c])=>{const p=pct(c);return `<span class="cl" style="left:${p[0]}%;top:${p[1]}%">${n}</span>`}).join('')+v.map(x=>{const p=pct(pos(x));return `<button class="mk ${zoom||x.id===sel?'pill':''} ${x.id===sel?'sel':''}" style="left:${p[0]}%;top:${p[1]}%" aria-label="${x.t}, ${pt(x)}" onclick="pick(${x.id})">${zoom||x.id===sel?sh(x):''}</button>`}).join('');
const pop=$('#pop'),s=v.find(x=>x.id===sel);
if(s){const [a,b]=pal[s.id%4];pop.className='on';pop.innerHTML=`<button class="x" aria-label="Close" onclick="sel=null;draw()">✕</button><div class="th" style="background:linear-gradient(135deg,${a},${b})">${house}</div><div><div class="tg">${ML[s.m]}</div><div class="pr">${pt(s)}</div><div>${s.t}</div><div class="sm">${s.b} bed · ${s.ba} bath · ${s.l}</div><button class="btn" onclick="toast('Opens the full listing')">View property</button></div>`}else pop.className=''}
function pick(id){sel=id;const x=L.find(y=>y.id===id);if(reg==='all'){reg=x.r;rchips()}draw();const e=document.querySelector('.it.sel');if(e&&innerWidth>=900)e.scrollIntoView({block:'nearest',behavior:'smooth'})}
function tf(id){fav.has(id)?fav.delete(id):fav.add(id);try{localStorage.setItem('kf',JSON.stringify([...fav]))}catch(e){}draw()}
function rchips(){$('#rg').innerHTML=RN.map(([k,n])=>`<button aria-pressed="${k===reg}" onclick="reg='${k}';sel=null;rchips();draw()">${n}</button>`).join('')}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));sel=null;draw()});
['fT','fB'].forEach(i=>$('#'+i).onchange=()=>{sel=null;draw()});
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',2200)}
rchips();draw();
</script></body></html>
